x-build-defaults: &build-defaults
  user: "${UID:-1000}:${GID:-1000}"
  working_dir: /build
  volumes:
    - .:/build
  environment:
    HOME: /build/.docker-home
    GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
  command: ["bash", "-c", "mkdir -p $$HOME && exec sleep infinity"]

services:
  debian:
    <<: *build-defaults
    build:
      context: .
      dockerfile: Dockerfile.debian
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    container_name: packages-debian

  alpine:
    <<: *build-defaults
    build:
      context: .
      dockerfile: Dockerfile.alpine
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    container_name: packages-alpine

  rhel-8:
    <<: *build-defaults
    build:
      context: .
      dockerfile: Dockerfile.rhel
      args:
        ALMA_VERSION: "8"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    container_name: packages-rhel-8

  rhel-9:
    <<: *build-defaults
    build:
      context: .
      dockerfile: Dockerfile.rhel
      args:
        ALMA_VERSION: "9"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    container_name: packages-rhel-9

  rhel-10:
    <<: *build-defaults
    build:
      context: .
      dockerfile: Dockerfile.rhel
      args:
        ALMA_VERSION: "10"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    container_name: packages-rhel-10
