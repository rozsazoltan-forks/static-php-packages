# Debug helper for the intermittent silent "Aborted (core dumped) zig-cc" during
# the LTO link of sapi/cli/php (zig ld.lld child dies, zig aborts without output).
# Dispatch manually; does not run on push/schedule.
name: Debug zig crash

on:
    workflow_dispatch:
        inputs:
            cache-week:
                description: 'Buildroot cache week (YYYY-WW)'
                default: '2026-27'
            craft-ref:
                description: 'Commit whose craft.yml.twig to build with (empty = current)'
                default: 'cbab85e7b488cee383bb69412701998d80486a48'
            iterations:
                description: 'Link attempts after a failure'
                default: '2'

jobs:
    repro:
        runs-on: ubuntu-24.04
        container:
            image: ghcr.io/static-php/packages-builder-debian:latest
            # privileged so we can point kernel.core_pattern at a plain file; the
            # default host pattern pipes cores to a helper we cannot reach from here
            options: --privileged
        permissions:
            contents: read
            packages: read
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false

            -   name: Host info
                run: |
                    uname -a
                    cat /proc/sys/vm/mmap_rnd_bits 2>/dev/null || true
                    cat /proc/sys/kernel/core_pattern || true
                    nproc
                    ulimit -a
                    grep -m1 'model name' /proc/cpuinfo || true
                    grep -m1 'flags' /proc/cpuinfo | md5sum || true
                    grep MemTotal /proc/meminfo || true
                    /opt/spc-pkgroot/zig/zig version

            -   name: Use requested craft template
                if: ${{ inputs.craft-ref != '' }}
                run: |
                    git config --global --add safe.directory "$GITHUB_WORKSPACE"
                    git fetch --depth=1 origin ${{ inputs.craft-ref }}
                    git checkout ${{ inputs.craft-ref }} -- config/templates/craft.yml.twig

            -   name: Install vendor
                run: composer install --no-interaction --prefer-dist --no-progress

            -   name: Download artifact from spc-download.yml
                uses: dawidd6/action-download-artifact@ac66b43f0e6a346234dd65d4d0c8fbb31cb316e5 # v11
                with:
                    workflow: spc-download.yml
                    name: downloads-tarball
                    branch: master
                    search_artifacts: true

            -   name: Extract downloads
                run: |
                    mkdir -p downloads
                    tar -xzf downloads.tar.gz -C downloads
                    rm downloads.tar.gz

            -   name: Restore buildroot (fixed week)
                run: |
                    curl -fsSL "https://github.com/${{ github.repository }}/releases/download/cache-${{ inputs.cache-week }}/buildroot-deb-amd64-zig.tar.zst" -o buildroot.tar.zst
                    tar --zstd -xf buildroot.tar.zst
                    rm buildroot.tar.zst

            -   name: Install debug tools
                run: apt-get update -qq && apt-get install -y -qq gdb strace procps

            -   name: Build (crash expected at the cli link)
                id: build
                continue-on-error: true
                run: |
                    ulimit -c unlimited
                    bin/spp build --phpv=8.5 --type=deb --packages=cli

            -   name: Re-run failing make with diagnostics
                if: ${{ steps.build.outcome == 'failure' }}
                run: |
                    set -x
                    ulimit -c unlimited
                    ulimit -n 2048
                    export PATH="/opt/spc-pkgroot/zig:/opt/spc-pkgroot/bin:$PATH"
                    export SPC_TARGET=x86_64-linux-gnu
                    export SPC_COMPILER_EXTRA='-fno-sanitize=undefined'
                    export BUILD_INCLUDE_PATH="$GITHUB_WORKSPACE/buildroot/include"
                    mkdir -p diag
                    # make cores land as plain files in the crashing process's cwd; the host
                    # default pipes them to a helper that is unreachable from this container
                    sysctl -w kernel.core_pattern='core.%e.%p' || echo "WARN: cannot set core_pattern; no cores will be captured"
                    MAKE_CMD=$(grep -m1 -o 'Failed command: make .*' log/spc.output.log | sed 's/^Failed command: //') || true
                    if [ -z "$MAKE_CMD" ]; then echo "no failed make command found"; exit 0; fi
                    echo "$MAKE_CMD" > diag/make-cmd.txt
                    cd source/php-src
                    crashed=0
                    for i in $(seq 1 ${{ inputs.iterations }}); do
                        rm -f core.* sapi/cli/php
                        if eval "$MAKE_CMD" > ../../diag/make.$i.out 2> ../../diag/make.$i.err; then
                            echo "iter $i OK"
                        else
                            rc=$?
                            crashed=1
                            echo "iter $i FAILED rc=$rc"
                            tail -5 ../../diag/make.$i.err || true
                            # backtrace every core (SIGSEGV child = the lld crash, SIGABRT parent = zig's reaction)
                            for c in core.*; do
                                [ -f "$c" ] || continue
                                gdb -q -batch -ex 'set pagination off' -ex 'info registers rip rsp' -ex bt -ex 'thread apply all bt' \
                                    /opt/spc-pkgroot/zig/zig "$c" > "../../diag/gdb-$i-$c.txt" 2>&1 || true
                            done
                            ls -la core.* > ../../diag/cores.$i.txt 2>&1 || echo "no cores captured" > ../../diag/cores.$i.txt
                            rm -f core.*
                        fi
                    done
                    [ "$crashed" = 1 ] || { echo "crash did not re-reproduce in diagnostics"; exit 0; }
                    # mitigation matrix: the crash is deterministic on an affected VM, so test which
                    # link-time flag dodges it (wrapper appends SPC_COMPILER_EXTRA to every zig cc call)
                    ulimit -c 0
                    m=0
                    for mit in '-Wl,--threads=1' '-Wl,--thinlto-jobs=1' '-Wl,--lto-O0' '-Wl,--threads=1 -Wl,--thinlto-jobs=1'; do
                        m=$((m+1))
                        rm -f sapi/cli/php
                        if SPC_COMPILER_EXTRA="-fno-sanitize=undefined $mit" eval "$MAKE_CMD" > /dev/null 2> ../../diag/mit.$m.err; then
                            echo "MITIGATION OK:   $mit" | tee -a ../../diag/mitigations.txt
                        else
                            echo "MITIGATION FAIL: $mit (rc=$?, $(grep -c 'terminated by signal' ../../diag/mit.$m.err || true) signal deaths)" | tee -a ../../diag/mitigations.txt
                        fi
                    done

            -   name: Upload diagnostics
                if: ${{ always() }}
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    name: zig-crash-diag
                    path: |
                        diag
                        log

            -   name: Report result
                if: ${{ always() }}
                run: |
                    if [ "${{ steps.build.outcome }}" = "failure" ]; then
                        echo "::error::zig crash REPRODUCED — see the zig-crash-diag artifact"
                        exit 1
                    fi
                    echo "no crash this run (clean VM); re-dispatch to try another runner"
